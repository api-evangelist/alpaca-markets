apis:
- aid: alpaca-markets:alpaca-markets-streaming-api
  name: Alpaca Market Data Streaming API
  tags:
  - Streaming
  - WebSocket
  - Market Data
  - Real Time
  - Trading
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.alpaca.markets/docs/streaming-market-data
  baseURL: wss://stream.data.alpaca.markets
  properties:
  - url: https://docs.alpaca.markets/docs/streaming-market-data
    type: Documentation
  - url: https://docs.alpaca.markets/docs/real-time-crypto-pricing-data
    type: APIReference
  - url: asyncapi/alpaca-markets-asyncapi.yml
    type: AsyncAPI
  description: >-
    Real-time market data over WebSocket. Stocks stream at wss://stream.data.alpaca.markets/v2/{feed}
    (iex, sip, delayed_sip, test) and crypto at wss://stream.data.alpaca.markets/v1beta3/crypto/us. Authenticate
    with an auth message, then subscribe to trades, quotes, bars, dailyBars, updatedBars, statuses, lulds,
    and (crypto) orderbooks per symbol or with a wildcard. This is a documented public wss:// API.
